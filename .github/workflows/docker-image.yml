name: Build & Publish Docker image

# Build a fresh image on every push to the repo (and on manual runs / tags),
# then publish it to GitHub Container Registry (ghcr.io). Portainer can then
# pull ghcr.io/<owner>/homelab-hub:latest and redeploy.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image repo is derived from the GitHub repo, lowercased by the metadata step.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # "latest" only for the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # branch name for non-default branches
            type=ref,event=branch
            # git tags like v1.2.3
            type=semver,pattern={{version}}
            # short commit SHA for every build
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
