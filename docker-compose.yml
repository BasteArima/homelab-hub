version: "3.8"

services:
  homelab-hub:
    build: .
    container_name: homelab-hub
    ports:
      - "6232:3001"
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      # Override in your environment or .env file. Defaults to "admin123".
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      # Persist services.json across container rebuilds
      - ./data:/app/data
    restart: unless-stopped
    # Optional: limit resources on a small homelab box
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M
