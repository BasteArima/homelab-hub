# ─────────────────────────────────────────────────────────────
# Homelab Hub — Portainer / production stack
#
# This pulls the image published by GitHub Actions on every commit
# (ghcr.io/bastearima/homelab-hub). In Portainer:
#   1. Stacks → Add stack → paste this file (or point it at the repo).
#   2. Set ADMIN_PASSWORD under "Environment variables".
#   3. To update: Pull and redeploy (enable "Re-pull image").
#
# Prefer to build locally instead of pulling? Comment out `image:` and
# uncomment `build: .` below.
# ─────────────────────────────────────────────────────────────
services:
  homelab-hub:
    image: ghcr.io/bastearima/homelab-hub:latest
    # build: .
    container_name: homelab-hub
    ports:
      - "6232:3001"
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      # Set this in Portainer / your .env. Defaults to "admin123" if unset.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      # Private mode: when true, visitors on the PUBLIC domain see only a
      # password gate until they sign in. Local (LAN) access is never gated.
      - PRIVATE_MODE=${PRIVATE_MODE:-false}
      # LAN address of THIS machine. Health checks use it for services whose
      # "Local host" is blank (meaning "same box as the hub") — inside the
      # container `localhost` is the container itself, not the host.
      # Falls back to host.docker.internal when unset.
      - LAN_HOST=${LAN_HOST:-}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux (the LAN_HOST fallback).
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist services.json across container updates.
      - homelab-data:/app/data
    restart: unless-stopped
    # Optional: limit resources on a small homelab box
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 256M

volumes:
  homelab-data:
